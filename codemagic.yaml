workflows:
  android-workflow:
    name: Android Build (APK + AAB)
    # لينكس أرخص وأسرع كثيراً من الماك لبناء الأندرويد
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: تحميل الحزم
        script: flutter pub get

      - name: فحص الكود
        script: flutter analyze

      - name: الاختبارات
        script: flutter test

      - name: بناء APK و AAB
        script: |
          flutter build apk --release
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - tajalsir2026@example.com   # ← غيّرها لإيميلك ليصلك الـ APK
        notify:
          success: true
          failure: true
