name: gold_accounts
description: "تطبيق محاسبة لمحلات الذهب: مشتريات، مبيعات، منصرفات، شركاء، وأرباح."
publish_to: 'none'
version: 4.1.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # تخزين محلي
  shared_preferences: '>=2.2.0 <3.0.0'

  # تشفير كلمة السر (SHA-256) — حزمة Dart خالصة بدون كود أصلي
  crypto: '>=3.0.0 <4.0.0'

  # مسار مجلد النسخ الاحتياطية
  path_provider: '>=2.0.0 <3.0.0'

  # طلبات HTTP للمزامنة السحابية (Supabase)
  http: '>=1.0.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
